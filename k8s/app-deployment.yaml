apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbuzina-assistant
  labels:
    app: arbuzina-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arbuzina-assistant
  template:
    metadata:
      labels:
        app: arbuzina-assistant
    spec:
      containers:
        - name: app
          image: arbuzina-assistant:lab5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8038
          envFrom:
            - configMapRef:
                name: arbuzina-app-config
          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: arbuzina-app-secret
                  key: APP_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arbuzina-app-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@arbuzina-postgres:5432/$(POSTGRES_DB)"
